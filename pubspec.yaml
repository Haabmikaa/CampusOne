name: campus_one
description: Smart Campus Companion — A modern AI-powered campus ecosystem.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.0
  firebase_messaging: ^15.0.0
  firebase_analytics: ^11.1.0
  firebase_crashlytics: ^4.0.3
  google_sign_in: ^6.2.1
  google_generative_ai: ^0.4.5
  flutter_dotenv: ^5.1.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # UI & Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  smooth_page_indicator: ^1.2.0
  fl_chart: ^0.69.0
  flutter_svg: ^2.0.10+1

  # Local Storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.1
  flutter_secure_storage: ^9.0.0

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Image & File Picking
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  permission_handler: ^11.3.1

  # Networking & Utils
  dio: ^5.7.0
  connectivity_plus: ^6.0.3
  intl: ^0.19.0
  uuid: ^4.4.2
  url_launcher: ^6.3.0
  share_plus: ^10.0.2

  # Local Auth (Biometrics)
  local_auth: ^2.3.0

  # Icons
  cupertino_icons: ^1.0.8

  # Fonts (loaded at runtime, no files needed)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - .env
